{% extends "base.html" %}{% block title %}New Connection Request{% endblock %}{% block content %}
<div class="page-title"><span class="eyebrow">RURAL ELECTRIFICATION</span><h1>Request a new connection</h1><p>Register a household connection request for department review.</p></div>
<div class="panel form-panel"><form method="post"><div class="mb-3"><label class="form-label">Applicant name *</label><input class="form-control" name="name" required></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Phone number *</label><input class="form-control" name="phone" inputmode="tel" required></div><div class="col-md-6"><label class="form-label">Village *</label><select class="form-select" name="village_id" required><option value="">Choose village</option>{% for v in villages %}<option value="{{ v.id }}">{{ v.name }} — {{ v.district }}</option>{% endfor %}</select></div></div><div class="my-3"><label class="form-label">Full address *</label><textarea class="form-control" name="address" rows="3" required></textarea></div><button class="btn btn-primary btn-lg">Submit request</button></form></div>{% endblock %}
